<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยื่นแบบฟอร์มภาษี</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>ระบบยื่นแบบฟอร์มภาษีเงินได้บุคคลธรรมดา</h1>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <h2 class="page-title">ยินดีต้อนรับ</h2>
                <p class="text-center" style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 40px;">
                    กรุณาเลือกรายการที่ต้องการ
                </p>
                
                <div class="home-buttons">
                    <button class="btn btn-primary btn-large" onclick="goToHistory()">
                        📋 ดูประวัติการยื่นแบบฟอร์ม
                    </button>
                    
                    <button class="btn btn-primary btn-large" onclick="goToSubmit()">
                        📝 ยื่นแบบฟอร์มภาษี
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>กำลังโหลด...</p>
    </div>

    <!-- WatsonX Agent Chat Widget Container -->
    <div id="root"></div>

    <script src="../static/js/app.js"></script>
    
    <!-- WatsonX Orchestrate Agent Embed Script -->
    <script>
      window.wxOConfiguration = {
        orchestrationID: "baf3554ebf3c4225ac4c4e9efb79516b_240d6b03-bd82-43d9-8d0e-fae8ee2659e5",
        hostURL: "https://us-south.watson-orchestrate.cloud.ibm.com",
        rootElementID: "root",
        deploymentPlatform: "ibmcloud",
        crn: "crn:v1:bluemix:public:watsonx-orchestrate:us-south:a/baf3554ebf3c4225ac4c4e9efb79516b:240d6b03-bd82-43d9-8d0e-fae8ee2659e5::",
        chatOptions: {
          agentId: "f3ba7f22-e1a0-486b-bde6-fec8061751e3"
        }
      };

      setTimeout(function () {
        const script = document.createElement("script");
        script.src = `${window.wxOConfiguration.hostURL}/wxochat/wxoLoader.js?embed=true`;
        script.addEventListener("load", function () {
          wxoLoader.init();
        });
        document.head.appendChild(script);
      }, 0);
    </script>
</body>
</html>
