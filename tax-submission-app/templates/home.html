{% extends "base.html" %}

{% block title %}Home - Tax Submission System{% endblock %}

{% block content %}
<div class="home-container">
    <div class="welcome-section">
        <h2>Welcome to Tax Submission System</h2>
        <p>ยินดีต้อนรับสู่ระบบยื่นแบบภาษี</p>
    </div>

    <div class="button-container">
        <a href="/submit" class="btn btn-primary btn-large">
            <span class="btn-icon">📝</span>
            <span class="btn-text">Submit New Tax Form</span>
            <span class="btn-subtext">ยื่นแบบภาษีใหม่</span>
        </a>

        <a href="/history" class="btn btn-secondary btn-large">
            <span class="btn-icon">📋</span>
            <span class="btn-text">View Submission History</span>
            <span class="btn-subtext">ดูประวัติการยื่นแบบ</span>
        </a>
    </div>
</div>
{% endblock %}
