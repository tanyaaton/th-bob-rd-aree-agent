<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันการยื่นแบบฟอร์ม - ระบบยื่นแบบฟอร์มภาษี</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>ระบบยื่นแบบฟอร์มภาษีเงินได้บุคคลธรรมดา</h1>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <h2 class="page-title">ยืนยันข้อมูลก่อนส่ง</h2>
                <p class="text-center" style="color: var(--text-secondary); margin-bottom: 30px;">
                    กรุณาตรวจสอบข้อมูลให้ถูกต้องก่อนยืนยันการส่ง
                </p>
                
                <div class="table-container">
                    <table class="summary-table">
                        <thead>
                            <tr>
                                <th>ประเภทรายได้</th>
                                <th>จำนวนเงิน (บาท)</th>
                            </tr>
                        </thead>
                        <tbody id="confirmationTableBody">
                            <!-- Will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div class="button-group mt-40">
                    <button class="btn btn-secondary" onclick="goBack()">
                        ← แก้ไขข้อมูล
                    </button>
                    <button class="btn btn-primary" onclick="confirmSubmit()">
                        ✓ ยืนยันและส่ง
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>กำลังส่งข้อมูล...</p>
    </div>

    <script src="../static/js/app.js"></script>
</body>
</html>
